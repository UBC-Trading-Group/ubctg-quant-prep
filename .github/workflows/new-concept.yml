name: New Concept Draft

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Concept title"
        required: true
        type: string
      slug:
        description: "Optional URL slug; leave blank to generate from title"
        required: false
        type: string
      description:
        description: "Short page description"
        required: true
        type: string
      topic:
        description: "Topic area"
        required: true
        type: string
      difficulty:
        description: "Difficulty"
        required: true
        default: "Beginner"
        type: choice
        options:
          - Beginner
          - Intermediate
          - Advanced
      tags:
        description: "Comma-separated tags, e.g. probability, expected value"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-concept:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create concept markdown
        id: concept
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const input = context.payload.inputs;
            const makeSlug = (value) =>
              value
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");

            const slug = makeSlug(input.slug || input.title);
            if (!slug) {
              core.setFailed("Could not generate a slug. Add an explicit slug and run the workflow again.");
              return;
            }

            const filePath = `src/content/concepts/${slug}.md`;
            if (fs.existsSync(filePath)) {
              core.setFailed(`Concept already exists: ${filePath}`);
              return;
            }

            const tags = (input.tags || "")
              .split(",")
              .map((tag) => tag.trim())
              .filter(Boolean);

            const yamlString = (value) => JSON.stringify(value || "");
            const yamlArray = (values) => `[${values.map(yamlString).join(", ")}]`;

            const content = `---
            title: ${yamlString(input.title)}
            description: ${yamlString(input.description)}
            topic: ${yamlString(input.topic)}
            difficulty: ${yamlString(input.difficulty)}
            tags: ${yamlArray(tags)}
            relatedGames: []
            relatedQuestions: []
            ---

            # ${input.title}

            ## Core Idea

            Explain the concept in plain language.

            ## Formula

            $$
            ...
            $$

            ## Intuition

            Explain why the formula or result makes sense.

            ## Original Example

            Use an original example, not copied textbook text.

            ## Common Mistake

            Explain the trap.

            ## Related Practice

            Link to related games and worked questions.
            `.replace(/^ {12}/gm, "");

            fs.mkdirSync(path.dirname(filePath), { recursive: true });
            fs.writeFileSync(filePath, content);

            core.setOutput("slug", slug);
            core.setOutput("file_path", filePath);

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: concept/${{ steps.concept.outputs.slug }}
          title: "Add concept: ${{ inputs.title }}"
          commit-message: "Add concept: ${{ inputs.title }}"
          body: |
            Adds a new draft concept markdown file:

            `${{ steps.concept.outputs.file_path }}`

            Fill in the draft sections, confirm related games/questions, and merge when the build check passes.
